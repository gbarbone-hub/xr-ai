[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presentation-view"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyyaml",
]

[project.scripts]
presentation_view = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
