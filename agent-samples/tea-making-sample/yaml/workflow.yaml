task:
  name: tea making
  start_step: identify
  foreground_prompt: This workflow guides tea making.
  complete_message: Tea guidance complete. Enjoy your tea.

state:
  tea_name:
    type: string
    description: Tea name from the current caption.
  target_temperature_c:
    type: number
    description: Brewing temperature in Celsius.
  steep_duration_s:
    type: integer
    description: Steep duration in seconds.
  guidance_source:
    type: string
    description: Package or retrieved source.
  tea_ready:
    type: boolean
    description: True only when all preceding fields are supported.
  water_filled:
    type: boolean
    description: Whether water is visibly in the heating vessel.
    initial: false
  heating_started:
    type: boolean
    description: Whether the kettle display reached the target setting.
    initial: false
  steeping_started_at_us:
    type: integer
    description: Steeping start time, set by the workflow when steeping starts.
    stamp: now
  steeping_started:
    type: boolean
    description: Whether tea is immersed and its start time is recorded.
    initial: false
  steeping_complete:
    type: boolean
    description: Whether the fresh timer result is expired.
    initial: false

steps:
  - id: identify
    title: Identify the tea
    reads: []
    writes: [tea_name, target_temperature_c, steep_duration_s, guidance_source, tea_ready]
    trigger:
      function: current_view
      interval_s: 1.5
      arguments:
        question: >-
          Read the front label brand and tea/blend name, plus visible brewing
          temperature/time, including words such as boiling water. Ignore slogans, claims, bag count, weight, and
          badges. Transcribe exactly; never infer. If no brand or tea/blend is
          legible, say label unreadable.
      result_field: answer
    evidence:
      pattern: "^accepted$"
      consecutive: 1
    atomic: true
    agent:
      prompt: >-
        Commit all five fields at once with tea_ready true, or commit empty
        updates with no message. Never save a partial result. tea_name is the
        brand and blend exactly as the current caption reads it; if the caption
        says the label is unreadable or names no tea, commit empty updates
        with unknown evidence. Once the name is known, use any temperature or
        steep time printed in the caption, with guidance_source package.
        Store Celsius: convert Fahrenheit, treat boiling as 100, and use the
        upper value of a range. For anything not printed, call rag_lookup once
        with "<tea name> water temperature steep time", top_k 2, and use the
        entry for that tea or its style, such as black, green, or herbal, with
        guidance_source tea guide. Steep time is in seconds.
      tools: [rag_lookup]
    voice:
      prompt: >-
        Tea identity comes only from state tea_name or current_view, never RAG.
        tea_ready means the tea instructions were identified, not that the
        drink has been prepared.
        If the exact name is unknown, inspect the current frame. Retrieve only
        missing temperature or duration after the exact name is known. Never
        replace package values. Speak temperatures only in degrees Fahrenheit;
        convert any Celsius value and never say Celsius. Answer only what was
        asked.
      tools: [current_view, rag_lookup]
    complete_when: {tea_ready: true}
    next: fill_water
    state_on_skip:
      tea_name: generic tea
      target_temperature_c: 93
      steep_duration_s: 180
      guidance_source: generic fallback
      tea_ready: true
    messages:
      enter: Hold the tea package or tag in view so I can read it.
      complete: I found the tea instructions. Say "Agent, next" when ready.
      skip: I will use generic tea defaults.

  - id: fill_water
    title: Fill the heating vessel
    reads: [tea_name, target_temperature_c, steep_duration_s]
    writes: [water_filled]
    trigger:
      function: current_view
      interval_s: 2
      arguments:
        question: >-
          The kettle body is opaque or tinted, so water is hard to see through
          the walls. Look for direct cues: a water surface, shine, or ripples
          seen through the open lid or spout; a water line in a side level
          window or gauge; or water pouring into it. State which cue is visible.
          If none is visible, say whether the lid is closed, the opening is out
          of view, or the gauge is not visible. Never infer.
      result_field: answer
    evidence:
      pattern: "^accepted$"
      consecutive: 2
    agent:
      prompt: >-
        Judge the fresh caption semantically without requiring particular
        words. The kettle is opaque or tinted, so accept any direct cue: a
        water surface, shine, or ripples through the opening, a water line in a
        level window or gauge, or water pouring in. Set water_filled true for
        such a cue. If the caption says the lid is closed, the opening or gauge
        is out of view, or contents are unclear, commit empty updates with
        unknown evidence. Use rejected evidence only for a visibly empty vessel.
      tools: []
    voice:
      prompt: >-
        Give instructions or verify with current_view. A user report is not
        visual confirmation. Confirm filled only from state water_filled or a
        current view showing concrete water cues. The kettle is opaque or
        tinted, so if water is not yet confirmed, coach the user with one
        concrete tip: fill up near the max line, open the lid and look down
        into it, tilt it toward the light, or show the water level window on
        the side. If they say it is
        full and you still cannot confirm, suggest saying skip.
      tools: [current_view]
    complete_when: {water_filled: true}
    next: heat_water
    state_on_skip: {water_filled: true}
    messages:
      enter: Fill the kettle with fresh water up near the max line, then open the lid and look down into it so I can see the water.
      complete: The vessel has water. Say "Agent, next" when ready.
      skip: I will assume the vessel is filled.

  - id: heat_water
    title: Heat the water
    reads: [tea_name, target_temperature_c, steep_duration_s]
    writes: [heating_started]
    trigger:
      function: current_view
      interval_s: 2
      arguments:
        question: >-
          Transcribe the number on the kettle's digital display. The display is
          in degrees Fahrenheit even if no unit symbol is shown. Say whether
          it looks like the current water temperature or a set target being
          adjusted, for example flashing or just after a button press. If the
          display is not legible, say so. Never infer.
      result_field: answer
    evidence:
      pattern: "^accepted$"
      consecutive: 2
    agent:
      prompt: >-
        This step completes when the water reaches the tea target. The kettle
        display is in Fahrenheit, so treat a bare number on it as Fahrenheit.
        For a fresh current reading, first call temperature__verify with that
        exact number and its unit. If ready is true, commit heating_started
        true. If ready is false, commit empty updates and message with rejected
        evidence. For a set target being adjusted, a flashing value, a missing
        or illegible reading, or an unclear current-versus-target value, do not
        call the tool; commit empty updates and message with unknown evidence.
      tools: [temperature__verify]
    voice:
      prompt: >-
        The kettle displays only Fahrenheit and is set with its plus and minus
        buttons to one of 104, 113, 122, 131, 140, 149, 158, 167, 176, 185,
        194, 203, or 212. Convert target_temperature_c to Fahrenheit (F = C x
        9/5 + 32) and always say the nearest of those settings. Never say
        Celsius. To explain how to set it, tell the user to press plus or minus
        until the display shows that number, then start the kettle. I watch the
        display and announce when the water is ready; the user does not need to
        ask. For questions about the target or whether it is right, answer from
        state with its source, for example the package or the general tea
        guide, without calling a tool. For a reading, call current_view and
        repeat the visible number and unit; do not verify. For hot-enough
        checks, call current_view, then temperature__verify only with an exact
        number and Celsius or Fahrenheit unit. Report result. If missing,
        say you cannot read the kettle display yet. Report verify results with
        the Fahrenheit fields.
      tools: [current_view, temperature__verify]
    complete_when: {heating_started: true}
    next: start_steeping
    state_on_skip: {heating_started: true}
    messages:
      enter: Press plus or minus until the kettle shows {{ target_temperature_c | kettle_f }}, then start heating. I'll watch the display and tell you when it's ready.
      complete: The water has reached {{ target_temperature_c | kettle_f }}. Say "Agent, next" when you're ready to steep.
      skip: I will assume the water is hot.

  - id: start_steeping
    title: Start steeping
    reads: [tea_name, target_temperature_c, steep_duration_s]
    writes: [steeping_started_at_us, steeping_started]
    trigger:
      function: current_view
      interval_s: 2
      arguments:
        question: >-
          Look into the mug or cup. Report each visible cue: liquid in the
          mug; liquid tinted amber or brown like tea; a tea bag or its string
          and paper tag hanging over the rim; a tea bag in the liquid. A
          submerged bag is often hidden, so report the cues you see. If the mug
          or its contents are not visible, say so. Never infer.
      result_field: answer
    evidence:
      pattern: "^accepted$"
      consecutive: 1
    agent:
      prompt: >-
        Judge when steeping starts, not when it finishes. Commit
        steeping_started true when the fresh caption shows liquid in the mug
        together with any tea cue: tinted amber or brown liquid, a tea bag in
        the liquid, or a tea bag string or tag hanging over the rim of a mug
        containing liquid. The workflow records the start time; never write
        steeping_started_at_us. If the mug is empty, commit empty updates with
        rejected evidence. If the mug or its contents are not visible or the
        caption is unclear, commit empty updates with unknown evidence.
      tools: []
    voice:
      prompt: >-
        The tea steeps in the user's mug or cup, never in the kettle: tell them
        to put the tea bag in the mug and pour the hot water over it. Give
        instructions or verify with current_view. A report or tea item in a
        mug is not confirmation. Water in the mug with tinted liquid or a tea
        bag string over the rim confirms it. If it is not yet confirmed, coach
        one tip: hold the mug in view and look down into it. The observation
        loop, not this answer, starts the timer.
      tools: [current_view]
    complete_when: {steeping_started: true}
    next: steep_timer
    complete_on_skip: true
    state_on_skip: {steeping_started: true}
    messages:
      enter: Put the tea bag in your mug or cup and pour in the hot water. I'll start the timer when I see the tea immersed.
      complete: I see the tea steeping and started the timer for {{ steep_duration_s | duration }}. Say "Agent, next" and I'll tell you when it's done.
      skip: Steeping detection and the timer were skipped.

  - id: steep_timer
    title: Wait for steeping
    reads:
      [tea_name, target_temperature_c, steeping_started_at_us, steep_duration_s]
    writes: [steeping_complete]
    trigger:
      function: clock__timer
      interval_s: 1
      arguments:
        started_at_us: $state.steeping_started_at_us
        duration_s: $state.steep_duration_s
    agent:
      prompt: >-
        Copy the fresh clock__timer expired boolean: set steeping_complete true
        only when expired is true. While false, commit empty updates/message.
        Never infer from elapsed text, wall time, or prior state.
      tools: []
    voice:
      prompt: >-
        Call clock__timer for every timer or completion question. Report only
        its fresh remaining time or completion; never calculate from state,
        prior answers, or wall-clock time.
      tools: [clock__timer]
    complete_when: {steeping_complete: true}
    next: null
    state_on_skip: {steeping_complete: true}
    messages:
      enter: Steep for {{ steep_duration_s | duration }}.
      complete: Steeping is complete. Remove the tea, then say "Agent, next" to finish.
      skip: Timer skipped; remove the tea when it tastes right.
